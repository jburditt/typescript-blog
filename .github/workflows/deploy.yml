name: Deploy Static Web App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'up (provision + deploy) or down (destroy)'
        required: true
        default: 'up'
        type: choice
        options: [up, down]

permissions:
  id-token: write
  contents: read

jobs:
  azd:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: typescript-blog
      AZURE_LOCATION: westus2
      AZURE_RESOURCE_GROUP: rg-typescript-blog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: Azure/setup-azd@v2

      - name: Log in with federated credentials
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider "github" --tenant-id "$AZURE_TENANT_ID"

      - name: Deploy
        if: github.event_name == 'push' || inputs.action == 'up'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ensure-resource-group.sh
          azd up --no-prompt

      - name: Destroy
        if: inputs.action == 'down'
        shell: bash
        run: |
          set -euo pipefail
          down_exit_code=0

          if [[ "$(az group exists --name "$AZURE_RESOURCE_GROUP" --output tsv)" == "true" ]]; then
            azd down --force --purge || down_exit_code=$?
          else
            echo "Resource group $AZURE_RESOURCE_GROUP does not exist; skipping azd down."
          fi

          ./scripts/delete-resource-group.sh

          if [[ "$down_exit_code" -ne 0 ]]; then
            exit "$down_exit_code"
          fi
